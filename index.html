<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Celebrate Ofaa!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f6f0;
            color: #4a3b32;
            text-align: center;
            overflow-x: hidden;
        }
        .header {
            padding: 70px 20px;
            background: linear-gradient(to bottom, #f3ebe1, #f9f6f0);
        }
        .subtitle {
            font-style: italic;
            letter-spacing: 2px;
            color: #8c6d58;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            font-weight: 300;
        }
        .highlight {
            font-style: italic;
            color: #b85c6c;
            font-weight: bold;
        }
        .cake {
            font-size: 3.5rem;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .btn {
            background-color: #5c3d46;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #7d5460;
            transform: scale(1.05);
        }
        .memories-section {
            padding: 40px 20px;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 450px;
            margin: 0 auto;
            padding: 10px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .card img, .card video {
            width: 100%;
            border-radius: 15px;
            display: block;
            object-fit: cover;
        }
        .date {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #8c6d58;
            font-weight: bold;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="header">
        <div class="subtitle">✦ HAPPY BIRTHDAY YOUSSEF ✦</div>
        <h1 dir="ltr">Let's Celebrate <br><span class="highlight">Ofaa</span> 🎂</h1>
        <div class="cake">❤️🎉</div>
        <button class="btn" onclick="celebrateNow()">✦ CELEBRATE 🎁</button>
    </div>

    <div class="memories-section">
        <div class="subtitle">✦ MEMORIES ✦</div>
        <h2 style="font-weight: 300; font-style: italic; font-size: 1.8rem; margin-top: 5px; color: #5c3d46;">Our Beautiful Moments</h2>
        
        <div class="gallery" id="photoGallery">
            </div>
    </div>

    <script>
        function celebrateNow() {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            setTimeout(function() {
                alert("كل سنه وانت طيب ي حبيبي وعمري،انا بحبك اوي وبحب ايامي كلها معاك...صحيح ده مش اول عيدميلاد ليك وانا معاك بس اول عيدميلاد وانا خطيبتك مش مجرد بيست فريند بقي😂،وان شاء الله عيدميلادك الجاي يكون واحنا متجوزين ومبسوطين واحاول اعملك سبرايز احلى من دي عشان انا معنديش غير اوفا واحد حبيبي وحياتي وعمري والله...ربنا يخليك ليا ي حبيب سوزو😂♥️♥️🙈");
            }, 500);
        }

        // كود ذكي بيقرأ كل الملفات المرفوعة في الـ Repository ويعرضها عل طول
        const username = "SalmaRifaay";
        const repo = "birth";
        
        fetch(`https://api.github.com/repos/${username}/${repo}/contents`)
            .then(res => res.json())
            .then(files => {
                const gallery = document.getElementById('photoGallery');
                let count = 1;
                
                // ترتيب الملفات
                files.forEach(file => {
                    const name = file.name.toLowerCase();
                    // التأكد إنها صورة أو فيديو ومش ملفات الكود
                    if (name !== 'index.html' && name !== 'readme.md' && (name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png') || name.endsWith('.mp4') || name.endsWith('.mov'))) {
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        if (name.endsWith('.mp4') || name.endsWith('.mov')) {
                            card.innerHTML = `<video src="${file.name}" controls></video>`;
                        } else {
                            let text = '';
                            if (count === 1) text = '<div class="date">أول صورة لينا سوا ♥</div>';
                            else if (count === 2) text = '<div class="date">أحلى يوم معاك ♥</div>';
                            else if (count === 3) text = '<div class="date">خطوبتنا المجنونة 💍</div>';
                            
                            card.innerHTML = `<img src="${file.name}" alt="Moment">${text}`;
                        }
                        
                        gallery.appendChild(card);
                        count++;
                    }
                });

                // إضافة الرسالة الأخيرة في آخر كارت
                if(gallery.lastChild) {
                    const lastCard = gallery.lastChild;
                    if(!lastCard.querySelector('.date')) {
                        const lastDate = document.createElement('div');
                        lastDate.className = 'date';
                        lastDate.innerHTML = 'كل سنة وأنت معايا ي حبيب سوزو 🙈❤️';
                        lastCard.appendChild(lastDate);
                    }
                }
            });
    </script>

</body>
</html>
