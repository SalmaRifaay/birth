<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Celebrate Medo!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f6f0;
            color: #4a3b32;
            text-align: center;
        }
        .header {
            padding: 60px 20px;
            background: linear-gradient(to bottom, #f3ebe1, #f9f6f0);
        }
        .subtitle {
            font-style: italic;
            letter-spacing: 2px;
            color: #8c6d58;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            font-weight: 300;
        }
        .highlight {
            font-style: italic;
            color: #b85c6c;
            font-weight: bold;
        }
        .cake {
            font-size: 3rem;
            margin: 20px 0;
        }
        .btn {
            background-color: #5c3d46;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #7d5460;
        }
        .memories-section {
            padding: 40px 20px;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .card img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }
        .date {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #8c6d58;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="subtitle">✦ A CELEBRATION ✦</div>
        <h1 dir="ltr">Let's Celebrate <br><span class="highlight">!Medo</span> 🎂</h1>
        <div class="cake">🎉</div>
        <button class="btn" onclick="alert('كل سنة وأنت طيب يا حبيبي! ❤️')">✦ CELEBRATE 🎁</button>
    </div>

    <div class="memories-section">
        <div class="subtitle">✦ MEMORIES ✦</div>
        <h2 style="font-weight: 300; font-style: italic; font-size: 1.8rem; margin-top: 5px;">Our Beautiful Moments</h2>
        
        <div class="gallery">
            <div class="card">
                <img src="https://via.placeholder.com/400x400/e8ded1/5c3d46?text=Your+Photo+1" alt="Memory 1">
                <div class="date" dir="ltr">NOV 23 2024</div>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/400x400/e8ded1/5c3d46?text=Your+Photo+2" alt="Memory 2">
                <div class="date" dir="ltr">MAY 4 2025</div>
            </div>
        </div>
    </div>

</body>
</html>
