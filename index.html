<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Celebrate Ofaa!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f2;
            color: #4a3b32;
            text-align: center;
            overflow-x: hidden;
        }
        /* شاشات الكويز والترحيب */
        .quiz-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #ffeef2 0%, #fcf8f2 100%);
            box-sizing: border-box;
            position: relative;
        }
        .quiz-card {
            background: white;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(184, 92, 108, 0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .quiz-title {
            font-size: 2rem;
            color: #5c3d46;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .quiz-subtitle {
            font-size: 1.1rem;
            color: #b85c6c;
            margin-bottom: 25px;
            font-style: italic;
        }
        .question-text {
            font-size: 1.3rem;
            color: #4a3b32;
            margin-bottom: 25px;
            font-weight: 500;
            line-height: 1.4;
        }
        .option-btn {
            display: block;
            width: 100%;
            background-color: #f9f2f4;
            color: #5c3d46;
            border: 2px solid #f0e2e6;
            padding: 15px;
            margin-bottom: 12px;
            font-size: 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s ease;
            text-align: center;
        }
        .option-btn:hover {
            background-color: #f0e2e6;
            border-color: #b85c6c;
        }
        /* صندوق الكتابة للسؤال الرابع */
        .text-input-container {
            display: none;
            margin-top: 15px;
            animation: fadeIn 0.4s ease;
        }
        .text-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #f0e2e6;
            border-radius: 15px;
            font-size: 1.1rem;
            font-family: inherit;
            box-sizing: border-box;
            text-align: center;
            color: #4a3b32;
        }
        .text-input:focus {
            border-color: #b85c6c;
            outline: none;
        }
        .submit-btn {
            background-color: #b85c6c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: 0.2s;
        }
        .submit-btn:hover {
            background-color: #5c3d46;
        }

        /* النوافذ المنبثقة (Pop-ups) */
        .error-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(92, 61, 70, 0.3);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .error-popup {
            background: white;
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-sizing: border-box;
            border: 2px solid #f0e2e6;
            animation: popupScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .error-emoji {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }
        .error-message {
            font-size: 1.3rem;
            color: #5c3d46;
            margin-bottom: 25px;
            font-weight: bold;
            line-height: 1.4;
        }
        .retry-btn {
            background-color: #b85c6c;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(184, 92, 108, 0.2);
            width: 100%;
            margin-bottom: 10px;
        }
        .retry-btn:hover {
            background-color: #9c4655;
        }
        .skip-btn {
            background-color: #5c3d46;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .skip-btn:hover {
            background-color: #7d5460;
        }

        @keyframes popupScale {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .start-btn {
            background-color: #5c3d46;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(92, 61, 70, 0.2);
            transition: 0.3s;
            margin-top: 20px;
        }

            transform: scale(1.05
